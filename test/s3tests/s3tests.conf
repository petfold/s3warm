; Configuration for running Ceph's s3-tests against a local s3warm gateway
; (the docker-compose stack, or any gateway with matching credentials).
; Used by test/s3tests/run.sh via S3TEST_CONF.

[DEFAULT]
host = localhost
port = 8333
is_secure = False
ssl_verify = False

[fixtures]
bucket prefix = s3warm-{random}-
iam name prefix = s3-tests-
iam path prefix = /s3-tests/

[s3 main]
display_name = s3warm
user_id = s3warm
email = dev@s3warm.local
api_name = us-east-1
access_key = s3warmdev
secret_key = s3warmdevsecret

; s3warm currently supports a single credential pair, so alt/tenant alias
; the main credentials (the suite's fixtures must be able to authenticate
; as them during setup/teardown). Tests whose semantics depend on distinct
; identities are excluded from passing.txt.
[s3 alt]
display_name = alt
user_id = alt
email = alt@s3warm.local
access_key = s3warmdev
secret_key = s3warmdevsecret

[s3 tenant]
display_name = tenant
user_id = tenant
email = tenant@s3warm.local
access_key = s3warmdev
secret_key = s3warmdevsecret
tenant = testx

[iam]
access_key = IAMKEYIAMKEYIAMKEY00
secret_key = iamsecretiamsecret
display_name = iam
user_id = iam
email = iam@s3warm.local

[iam root]
access_key = IAMROOTKEYIAMROOT000
secret_key = iamrootsecret
account_id = RGW11111111111111111
user_id = RGW11111111111111111
email = iamroot@s3warm.local

[iam alt root]
access_key = IAMALTROOTKEYIAM0000
secret_key = iamaltrootsecret
account_id = RGW22222222222222222
user_id = RGW22222222222222222
email = iamaltroot@s3warm.local
